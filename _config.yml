# Configuração do site (GitHub Pages / Jekyll)
# Não é preciso mexer neste arquivo para publicar artigos. Veja COMO-PUBLICAR.md.

title: Sonsim, Santolin & Alves Advogados Associados
description: Artigos informativos escritos pelos sócios de Sonsim, Santolin & Alves Advogados Associados.
url: "https://ssaadvocacia.com"
baseurl: ""
lang: pt-BR
timezone: America/Sao_Paulo

# Endereço de cada artigo: ssaadvocacia.com/artigos/2026/nome-do-arquivo/
permalink: /artigos/:year/:title/
markdown: kramdown

# O Google lê sozinho o mapa do site (sitemap.xml) e o feed de artigos (feed.xml),
# que são atualizados automaticamente a cada artigo publicado.
plugins:
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: artigo
  # Arquivo de verificação do Google Search Console: não deve aparecer no mapa do site
  - scope:
      path: "google161a3fa07242b4b5.html"
    values:
      sitemap: false

exclude:
  - COMO-PUBLICAR.md
  - modelo-de-artigo.md
  - README.md
